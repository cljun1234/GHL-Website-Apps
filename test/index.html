<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustabee Widget Test</title>
    <!-- Load the widget code -->
    <script src="../src/trustabee-widget.js"></script>
</head>
<body>
    <h1>Testing Trustabee Widget</h1>

    <!-- Use the widget with a mock location ID -->
    <trustabee-widget location-id="test-location-123"></trustabee-widget>

    <p>Open Developer Tools (F12) and check the "Elements" tab to see if the script tag was injected into the &lt;head&gt;.</p>

    <script>
        // Simple verification script
        window.addEventListener('load', () => {
            setTimeout(() => {
                const injectedScript = document.querySelector('script[src^="https://staging-trustabee.elefity.com/api/widget.js"]');
                const result = document.createElement('div');
                if (injectedScript) {
                    result.innerHTML = `<p style="color: green;">✅ SUCCESS: Script injected. <br> Source: ${injectedScript.src}</p>`;
                } else {
                    result.innerHTML = `<p style="color: red;">❌ FAILURE: Script not found.</p>`;
                }
                document.body.appendChild(result);
            }, 500);
        });
    </script>
</body>
</html>
